    /* ==============================================================
       HELPER: Determine trend from prior vs current
       ============================================================== */
    function getTrend(prior, current, threshold) {
      if (!prior || !current) return null;
      const p = parseFloat(prior);
      const c = parseFloat(current);
      if (isNaN(p) || isNaN(c)) return null;
      if (c > p) return "up";
      if (c < p) return "down";
      return "flat";
    }

    function getTrendIcon(trend) {
      if (trend === "up") return "\u2191";
      if (trend === "down") return "\u2193";
      if (trend === "flat") return "\u2192";
      return "";
    }

    /* Determine if threshold is met */
    function checkThreshold(value, threshold) {
      if (!value || !threshold) return "na";
      const v = parseFloat(value);
      if (isNaN(v)) {
        const vl = value.toLowerCase().trim();
        const tl = threshold.toLowerCase().trim();
        if (tl === "yes" && vl === "yes") return "met";
        if (tl === "yes" && vl === "no") return "not-met";
        if (tl === "none" && (vl === "none" || vl === "0" || vl === "")) return "met";
        if (tl === "none") return "not-met";
        if (tl === "all" || tl === "all ltc" || tl === "monthly" || tl === "track" || tl === "per comar") return "track";
        return "na";
      }
      const t = threshold.replace(/[^0-9.<>%\-+]/g, "");
      if (t.startsWith("<")) {
        const tv = parseFloat(t.substring(1));
        return v < tv ? "met" : "not-met";
      }
      if (t.startsWith(">")) {
        const tv = parseFloat(t.substring(1));
        return v > tv ? "met" : "not-met";
      }
      const tv = parseFloat(t);
      if (!isNaN(tv)) {
        if (threshold.includes("+")) return v >= tv ? "met" : "not-met";
        return v <= tv ? "met" : "not-met";
      }
      return "na";
    }

      const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
              AlignmentType, BorderStyle, WidthType, ShadingType, Header, Footer, PageNumber } = dl;

      const PAGE_W = 12240;
      const MARGIN = 1080; // 0.75 inch
      const TABLE_W = PAGE_W - MARGIN * 2; // 10080
      const COL_A = 4200; // Metric name
      const COL_B = 1300; // Prior Mo
      const COL_C = 1300; // Current Mo
      const COL_D = 1500; // Threshold
      const COL_E = 1780; // Trend/Notes

      const border = { style: BorderStyle.SINGLE, size: 1, color: "999999" };
      const borders = { top: border, bottom: border, left: border, right: border };
      const noBorder = { style: BorderStyle.NONE, size: 0 };
      const noBorders = { top: noBorder, bottom: noBorder, left: noBorder, right: noBorder };

      function cell(text, width, opts = {}) {
        const { bold, bg, align, fontSize, span } = opts;
        return new TableCell({
          width: { size: width, type: WidthType.DXA },
          borders,
          columnSpan: span || 1,
          shading: bg ? { fill: bg, type: ShadingType.CLEAR } : undefined,
          margins: { top: 40, bottom: 40, left: 80, right: 80 },
          children: [new Paragraph({
            alignment: align || AlignmentType.LEFT,
            spacing: { before: 20, after: 20 },
            children: [new TextRun({
              text: text || "",
              bold: bold || false,
              font: "Arial",
              size: fontSize || 18,
            })]
          })]
        });
      }

      function headerCell(text, width, opts = {}) {
        return cell(text, width, { bold: true, bg: "1A5276", fontSize: 18, align: AlignmentType.CENTER, ...opts });
      }

      // Override for header white text
      function headerCellWhite(text, width, opts = {}) {
        const { span } = opts;
        return new TableCell({
          width: { size: width, type: WidthType.DXA },
          borders,
          columnSpan: span || 1,
          shading: { fill: "1A5276", type: ShadingType.CLEAR },
          margins: { top: 40, bottom: 40, left: 80, right: 80 },
          children: [new Paragraph({
            alignment: AlignmentType.CENTER,
            spacing: { before: 20, after: 20 },
            children: [new TextRun({

              font: "Arial",
              size: 18,
              color: "FFFFFF",
            })]
          })]

      }

      const kpiData = formData.kpis || {};
      const rows = [];

      // Dept head / extension / month row

          cell(`Department Head: ${formData.deptHead || dept.deptHead}`, COL_A + COL_B, { bold: true, span: 2 }),
          cell(`Ext: ${dept.extension}`, COL_C),
          cell(`Reporting Month: ${MONTHS[month]} ${year}`, COL_D + COL_E, { bold: true, span: 2 }),
        ]
      }));

      // Data sources row
      rows.push(new TableRow({
        children: [
          new TableCell({
            width: { size: TABLE_W, type: WidthType.DXA },
            columnSpan: 5,
            borders,
            shading: { fill: "F2F2F2", type: ShadingType.CLEAR },
            margins: { top: 40, bottom: 40, left: 80, right: 80 },
            children: [new Paragraph({
              spacing: { before: 20, after: 20 },
              children: [new TextRun({
                text: `Data Sources: ${dept.dataSources}`,
                italics: true, font: "Arial", size: 16,

            })]

        ]
      }));

      // Column headers
      rows.push(new TableRow({
        children: [
          headerCellWhite("Performance Metric / KPI", COL_A),
          headerCellWhite("Prior Mo.", COL_B),
          headerCellWhite("Current Mo.", COL_C),
          headerCellWhite("Threshold/Target", COL_D),
          headerCellWhite("Trend / Notes", COL_E),

      // KPI rows
      dept.kpis.forEach((kpi, i) => {
        const k = kpiData[i] || {};
        const isAlt = i % 2 === 1;
        const bg = isAlt ? "F8F9FA" : undefined;
        rows.push(new TableRow({
          children: [
            cell(kpi.metric, COL_A, { bg, fontSize: 17 }),
            cell(k.prior || "", COL_B, { align: AlignmentType.CENTER, bg }),
            cell(k.current || "", COL_C, { align: AlignmentType.CENTER, bg }),
            cell(kpi.threshold || "\u2014", COL_D, { align: AlignmentType.CENTER, bg }),
            cell(k.notes || "", COL_E, { bg, fontSize: 16 }),
          ]
        }));
      });

      // Opportunities section
      rows.push(new TableRow({
        children: [
          new TableCell({
            width: { size: TABLE_W, type: WidthType.DXA },
            columnSpan: 5,
            borders,
            shading: { fill: "1A5276", type: ShadingType.CLEAR },
            margins: { top: 40, bottom: 40, left: 80, right: 80 },
            children: [new Paragraph({
              alignment: AlignmentType.LEFT,
              children: [new TextRun({
                text: "OPPORTUNITIES FOR IMPROVEMENT / BARRIERS (identify at least 1)",
                bold: true, font: "Arial", size: 18, color: "FFFFFF"
              })]
            })]
          })
        ]
      }));

      const opps = formData.opportunities || ["","",""];
      opps.forEach((opp, i) => {
        rows.push(new TableRow({
          children: [
            cell(`${i + 1}. ${opp || ""}`, TABLE_W, { span: 5 }),
          ]
        }));
      });

      // Plan for Improvement
      rows.push(new TableRow({
        children: [
          new TableCell({
            width: { size: TABLE_W, type: WidthType.DXA },
            columnSpan: 5,
            borders,
            shading: { fill: "1A5276", type: ShadingType.CLEAR },
            margins: { top: 40, bottom: 40, left: 80, right: 80 },
            children: [new Paragraph({
              alignment: AlignmentType.LEFT,
              children: [new TextRun({
                text: "PLAN FOR IMPROVEMENT",
                bold: true, font: "Arial", size: 18, color: "FFFFFF"
              })]
            })]
          })
        ]
      }));

      // Plan headers
      const PLAN_COL_A = 4500;
      const PLAN_COL_B = 2200;
      const PLAN_COL_C = 1580;
      const PLAN_COL_D = 1800;
      rows.push(new TableRow({
        children: [
          headerCellWhite("Action / Intervention", PLAN_COL_A),
          headerCellWhite("Responsible", PLAN_COL_B),
          headerCellWhite("Due Date", PLAN_COL_C),
          headerCellWhite("Status", PLAN_COL_D),
        ]
      }));

      const plans = formData.plans || [{},{},{},{}];
      plans.forEach(p => {
        rows.push(new TableRow({
          children: [
            cell(p.action || "", PLAN_COL_A),
            cell(p.responsible || "", PLAN_COL_B, { align: AlignmentType.CENTER }),
            cell(p.dueDate || "", PLAN_COL_C, { align: AlignmentType.CENTER }),
            cell(p.status || "", PLAN_COL_D, { align: AlignmentType.CENTER }),
          ]
        }));
      });

      // Signature row
      rows.push(new TableRow({
        children: [
          new TableCell({
            width: { size: TABLE_W, type: WidthType.DXA },
            columnSpan: 5,
            borders: noBorders,
            margins: { top: 120, bottom: 40, left: 80, right: 80 },
            children: [new Paragraph({
              spacing: { before: 120, after: 60 },
              children: [
                new TextRun({ text: `Prepared by: ${formData.preparedBy || ""}     `, font: "Arial", size: 18 }),
                new TextRun({ text: `Date: ${formData.preparedDate || ""}     `, font: "Arial", size: 18 }),
                new TextRun({ text: `Presented at QAPI:  ${formData.presentedAtQapi ? "Yes" : "No"}`, font: "Arial", size: 18 }),
              ]
            })]
          })
        ]
      }));

      const table = new Table({
        width: { size: TABLE_W, type: WidthType.DXA },
        columnWidths: [COL_A, COL_B, COL_C, COL_D, COL_E],
        rows,
      });

      const doc = new Document({
        sections: [{
          properties: {
            page: {
              size: { width: PAGE_W, height: 15840 },
              margin: { top: 720, right: MARGIN, bottom: 720, left: MARGIN },
            }
          },
          children: [table]
        }]
      });

      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `QAPI_${dept.id.replace(/\s/g,"_")}_${MONTHS[month]}_${year}.docx`;
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ==============================================================
       COPY TO CLIPBOARD (formatted text for email)
       ============================================================== */
    function copyToClipboard(dept, formData, month, year) {
      const kpiData = formData.kpis || {};
      let text = `${dept.title}\n`;
      text += `Department Head: ${formData.deptHead || dept.deptHead}  |  Ext: ${dept.extension}\n`;
      text += `Reporting Month: ${MONTHS[month]} ${year}\n`;
      text += `Data Sources: ${dept.dataSources}\n\n`;
      text += "=" .repeat(70) + "\n";
      text += "PERFORMANCE METRICS\n";
      text += "=".repeat(70) + "\n\n";

      dept.kpis.forEach((kpi, i) => {
        const k = kpiData[i] || {};
        const line = `${kpi.metric}\n`;
        const vals = `  Prior: ${k.prior || "\u2014"}  |  Current: ${k.current || "\u2014"}  |  Threshold: ${kpi.threshold || "\u2014"}`;
        const notes = k.notes ? `\n  Notes: ${k.notes}` : "";
        text += line + vals + notes + "\n\n";
      });

      text += "=".repeat(70) + "\n";
      text += "OPPORTUNITIES FOR IMPROVEMENT / BARRIERS\n";
      text += "=".repeat(70) + "\n\n";
      const opps = formData.opportunities || [];
      opps.forEach((o, i) => {
        if (o) text += `${i+1}. ${o}\n`;
      });

      text += "\n" + "=".repeat(70) + "\n";
      text += "PLAN FOR IMPROVEMENT\n";
      text += "=".repeat(70) + "\n\n";
      const plans = formData.plans || [];
      plans.forEach((p, i) => {
        if (p.action) {
          text += `${i+1}. ${p.action}\n   Responsible: ${p.responsible || "\u2014"}  |  Due: ${p.dueDate || "\u2014"}  |  Status: ${p.status || "\u2014"}\n\n`;
        }
      });

      text += `\nPrepared by: ${formData.preparedBy || ""}  |  Date: ${formData.preparedDate || ""}  |  Presented at QAPI: ${formData.presentedAtQapi ? "Yes" : "No"}\n`;

      navigator.clipboard.writeText(text).then(() => {
        alert("Copied to clipboard! Paste into email.");
      });
    }

    /* ==============================================================
       MAIN APP COMPONENT
       ============================================================== */
    function App() {
      const [screen, setScreen] = useState("home"); // home | form
      const [selectedDept, setSelectedDept] = useState(null);
      const [allData, setAllData] = useState(loadSavedData);

      const now = new Date();
      const [month, setMonth] = useState(now.getMonth());
      const [year, setYear] = useState(now.getFullYear());

      const formKey = selectedDept ? getFormKey(selectedDept.id, month, year) : null;

      const formData = useMemo(() => {
        if (!formKey) return null;
        return allData[formKey] || {
          deptHead: selectedDept?.deptHead || "",
          kpis: {},
          opportunities: ["", "", ""],
          plans: [{},{},{},{}],
          preparedBy: "",
          preparedDate: "",
          presentedAtQapi: false,
        };
      }, [formKey, allData, selectedDept]);

      const updateForm = useCallback((updater) => {
        setAllData(prev => {
          const current = prev[formKey] || {
            deptHead: selectedDept?.deptHead || "",
            kpis: {},
            opportunities: ["", "", ""],
            plans: [{},{},{},{}],
            preparedBy: "",
            preparedDate: "",
            presentedAtQapi: false,
          };
          const updated = typeof updater === "function" ? updater(current) : { ...current, ...updater };
          const next = { ...prev, [formKey]: updated };
          saveData(next);
          return next;
        });
      }, [formKey, selectedDept]);

      function openDept(dept) {
        setSelectedDept(dept);
        setScreen("form");
      }

      /* ---- Determine previous month data for prior-month auto-fill ---- */
      const prevMonth = month === 0 ? 11 : month - 1;
      const prevYear = month === 0 ? year - 1 : year;
      const prevFormKey = selectedDept ? getFormKey(selectedDept.id, prevMonth, prevYear) : null;
      const prevFormData = prevFormKey ? allData[prevFormKey] : null;

         ============================================================== */

        return (

            {/* Header */}
            <div className="bg-qapi-blue text-white rounded-xl p-6 mb-6 shadow-lg">
              <h1 className="text-2xl font-bold text-center">COFFMAN QAPI</h1>
              <p className="text-center text-qapi-accent mt-1 text-sm">Monthly Department Input Forms</p>
              <p className="text-center text-blue-200 text-xs mt-1">{FACILITY}</p>
            </div>

            {/* Month/Year selector */}
            <div className="bg-white rounded-lg shadow p-4 mb-6 flex flex-wrap items-center gap-3 justify-center">
              <label className="font-semibold text-sm text-gray-600">Reporting Month:</label>
              <select
                className="field-input w-auto"
                value={month}

                {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
              </select>
              <select
                className="field-input w-auto"

                onChange={e => setYear(parseInt(e.target.value))}

              </select>
            </div>

            {/* Department cards */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {DEPARTMENTS.map(dept => {
                const key = getFormKey(dept.id, month, year);
                const data = allData[key];
                const filled = data ? Object.keys(data.kpis || {}).length : 0;
                const total = dept.kpis.length;
                const pct = total > 0 ? Math.round((filled / total) * 100) : 0;
                const hasOpps = data?.opportunities?.some(o => o?.trim());
                return (
                  <button
                    key={dept.id}
                    onClick={() => openDept(dept)}
                    className="bg-white rounded-lg shadow hover:shadow-lg transition-all p-4 text-left border-l-4 border-qapi-blue hover:border-qapi-light"
                  >
                    <div className="font-bold text-qapi-blue text-sm">{dept.label}</div>
                    <div className="text-xs text-gray-500 mt-1">{dept.deptHead}</div>
                    <div className="mt-3 flex items-center gap-2">
                      <div className="flex-1 bg-gray-200 rounded-full h-2">
                        <div
                          className="bg-qapi-blue rounded-full h-2 transition-all"
                          style={{ width: `${pct}%` }}
                        />
                      </div>
                      <span className="text-xs text-gray-500 font-medium">{filled}/{total}</span>
                    </div>
                    {hasOpps && <span className="text-xs text-qapi-green mt-2 inline-block">Opportunities noted</span>}
                  </button>
                );
              })}
            </div>

            {/* Summary / Brief to DON button */}
            <div className="mt-6 text-center">
              <button
                onClick={() => generateBriefToDON(allData, month, year)}
                className="bg-qapi-blue text-white px-6 py-3 rounded-lg hover:bg-qapi-light transition font-semibold shadow"
              >
                Generate Brief to DON (All Departments)
              </button>
            </div>

            <p className="text-center text-xs text-gray-400 mt-6">
              Data saved locally in your browser. Export to Word or copy to email before clearing browser data.
            </p>
          </div>
        );
      }

      /* ==============================================================
         FORM SCREEN — individual department
         ============================================================== */
      if (screen === "form" && selectedDept && formData) {
        const dept = selectedDept;
        const kpiData = formData.kpis || {};

        return (
          <div className="max-w-5xl mx-auto p-4">
            {/* Back + actions bar */}
            <div className="flex flex-wrap items-center gap-2 mb-4 no-print">

                onClick={() => setScreen("home")}
                className="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium"
              >
                &larr; All Departments
              </button>
              <div className="flex-1" />
              <button

                Copy to Clipboard

                onClick={() => exportToWord(dept, formData, month, year)}

            {/* Dept head / month info */}
            <div className="bg-white border border-gray-200 p-4 flex flex-wrap gap-4 items-center">
              <div className="flex-1 min-w-[200px]">
                <label className="text-xs text-gray-500 font-medium">Department Head</label>
                <input
                  className="field-input mt-1"
                  value={formData.deptHead || ""}
                  onChange={e => updateForm({ deptHead: e.target.value })}

              </div>
              <div>
                <label className="text-xs text-gray-500 font-medium">Extension</label>
                <div className="mt-1 text-sm font-medium text-gray-700 py-2">{dept.extension}</div>
              </div>
              <div>
                <label className="text-xs text-gray-500 font-medium">Reporting Month</label>
                <div className="mt-1 text-sm font-medium text-gray-700 py-2">{MONTHS[month]} {year}</div>
              </div>
            </div>

            {/* Data sources */}
            <div className="bg-gray-50 border border-gray-200 border-t-0 p-3 text-xs text-gray-500 italic">
              Data Sources: {dept.dataSources}

            {/* KPI TABLE */}
            <div className="overflow-x-auto mt-4">
              <table className="w-full border-collapse bg-white shadow rounded-lg overflow-hidden">
                <thead>
                  <tr className="bg-qapi-blue text-white text-sm">

                    <th className="p-3 text-center font-semibold" style={{width:"13%"}}>Prior Mo.</th>
                    <th className="p-3 text-center font-semibold" style={{width:"13%"}}>Current Mo.</th>

                    const isAlt = i % 2 === 1;
                    // Auto-fill prior from previous month's current

                            onChange={e => {

                                kpis[i] = { ...kpis[i], prior: e.target.value };

                            className="field-input text-sm"

                              updateForm(prev => {

                            className="field-input text-sm"

                            onChange={e => {

                                return { ...prev, plans };

                Copy to Clipboard (for email)

                Export to Word (.docx)

              <button
                onClick={() => window.print()}
                className="bg-gray-600 text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 shadow"
              >
                Print
              </button>
            </div>
          </div>
        );
      }

      return null;
    }

    /* ==============================================================
       BRIEF TO DON — summary across all departments
       ============================================================== */
    async function generateBriefToDON(allData, month, year) {
      let text = `COFFMAN QAPI \u2014 BRIEF TO DON\n`;
      text += `Reporting Month: ${MONTHS[month]} ${year}\n`;
      text += `${"=".repeat(70)}\n\n`;

      DEPARTMENTS.forEach(dept => {
        const key = getFormKey(dept.id, month, year);
        const data = allData[key];
        text += `\u25A0 ${dept.label.toUpperCase()} (${dept.deptHead})\n`;

        if (!data || Object.keys(data.kpis || {}).length === 0) {
          text += `  [No data submitted yet]\n\n`;
          return;
        }

        // Show KPIs that have thresholds and are not met
        const issues = [];
        const kpiData = data.kpis || {};
        dept.kpis.forEach((kpi, i) => {
          const k = kpiData[i] || {};
          if (k.current && kpi.threshold) {
            const status = checkThreshold(k.current, kpi.threshold);
            if (status === "not-met") {
              issues.push(`  \u26A0 ${kpi.metric}: ${k.current} (target: ${kpi.threshold})`);
            }
          }
        });

        if (issues.length > 0) {
          text += `  Thresholds NOT Met:\n`;
          issues.forEach(iss => text += `${iss}\n`);
        } else {
          text += `  All thresholds met or tracked.\n`;
        }

        // Show opportunities
        const opps = (data.opportunities || []).filter(o => o?.trim());
        if (opps.length > 0) {
          text += `  Opportunities:\n`;
          opps.forEach((o, i) => text += `    ${i+1}. ${o}\n`);
        }

        text += "\n";
      });

      text += `\nGenerated: ${new Date().toLocaleDateString()}\n`;

      try {
        await navigator.clipboard.writeText(text);
        alert("Brief to DON copied to clipboard! Paste into email.");
      } catch {
        // Fallback: open in new window
        const w = window.open("", "_blank");
        w.document.write(`<pre style="font-family:Consolas,monospace;white-space:pre-wrap;padding:20px;">${text.replace(/</g,"&lt;")}</pre>`);
      }
    }

    /* ==============================================================
       RENDER
       ============================================================== */
    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
