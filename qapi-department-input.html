       GOOGLE SHEET CONNECTION

    const CONFIG_KEY = "coffman_qapi_config";

    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUce0HqpGQOk760SXUEIIcMRnfWTV-nf3-NIqk70VvMl4e6ZCYI-m2a6Na-GHod4_B4Q/exec";
    function getConfig() {
      try {
        const cfg = JSON.parse(localStorage.getItem(CONFIG_KEY)) || {};
        if (!cfg.scriptUrl) cfg.scriptUrl = DEFAULT_SCRIPT_URL;
        return cfg;
      } catch { return { scriptUrl: DEFAULT_SCRIPT_URL }; }
    }
    function saveConfig(cfg) {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    }
    function getLocalData() {
      try { return JSON.parse(localStorage.getItem(DATA_KEY)) || {}; } catch { return {}; }
    }

      localStorage.setItem(DATA_KEY, JSON.stringify(data));
    }

    // Fix garbled UTF-8 em-dashes (â€" → —) in API responses
    function fixEncoding(obj) {
      if (typeof obj === 'string') return obj.replace(/\u00e2\u20ac\u201d/g, '\u2014').replace(/\u00e2\u20ac\u201c/g, '\u2013');
      if (Array.isArray(obj)) return obj.map(fixEncoding);
      if (obj && typeof obj === 'object') {
        const fixed = {};
        for (const [k, v] of Object.entries(obj)) fixed[k] = fixEncoding(v);
        return fixed;
      }
      return obj;
    }

    async function fetchFromSheet(scriptUrl, action, params = {}) {
      const url = new URL(scriptUrl);
      url.searchParams.set("action", action);
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
      const resp = await fetch(url.toString());
      const data = await resp.json();
      return fixEncoding(data);
    }

    async function postToSheet(scriptUrl, payload) {
      const resp = await fetch(scriptUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload),
      });
      return resp.json();
    }

    /* ==============================================================
       HELPERS
       ============================================================== */
    function getTrend(prior, current) {
      if (!prior || !current) return null;
      const p = parseFloat(prior), c = parseFloat(current);
      if (isNaN(p) || isNaN(c)) return null;
      return c > p ? "up" : c < p ? "down" : "flat";
    }
    function getTrendIcon(t) { return t === "up" ? "\u2191" : t === "down" ? "\u2193" : t === "flat" ? "\u2192" : ""; }

    function checkThreshold(value, threshold) {
      if (!value || !threshold) return "na";
      const v = parseFloat(value);
      if (isNaN(v)) {
        const vl = value.toLowerCase().trim(), tl = threshold.toLowerCase().trim();
        if (tl === "yes") return vl === "yes" ? "met" : "not-met";
        if (tl === "none") return (vl === "none" || vl === "0" || vl === "") ? "met" : "not-met";
        if (["all","all ltc","monthly","track","per comar"].includes(tl)) return "track";
        return "na";
      }
      const t = threshold.replace(/[^0-9.<>%\-+]/g, "");
      if (t.startsWith("<")) return v < parseFloat(t.substring(1)) ? "met" : "not-met";
      if (t.startsWith(">")) return v > parseFloat(t.substring(1)) ? "met" : "not-met";
      const tv = parseFloat(t);
      if (!isNaN(tv)) return threshold.includes("+") ? (v >= tv ? "met" : "not-met") : (v <= tv ? "met" : "not-met");
      return "na";
    }

    function Toast({ message, type, onDone }) {

    }

    /* ==============================================================
       WORD EXPORT (unchanged logic, uses dept config)
       ============================================================== */
    async function exportToWord(dept, formData, month, year) {
      const dl = window.docxLib;
      if (!dl) { alert("Word export library still loading."); return; }
      const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, AlignmentType, BorderStyle, WidthType, ShadingType } = dl;
      const PAGE_W = 12240, MARGIN = 1080, TABLE_W = PAGE_W - MARGIN * 2;
      const COL_A = 4200, COL_B = 1300, COL_C = 1300, COL_D = 1500, COL_E = 1780;
      const border = { style: BorderStyle.SINGLE, size: 1, color: "999999" };
      const borders = { top: border, bottom: border, left: border, right: border };

      function cell(text, width, opts = {}) {
        return new TableCell({
          width: { size: width, type: WidthType.DXA }, borders, columnSpan: opts.span || 1,
          shading: opts.bg ? { fill: opts.bg, type: ShadingType.CLEAR } : undefined,
          margins: { top: 40, bottom: 40, left: 80, right: 80 },
          children: [new Paragraph({ alignment: opts.align || AlignmentType.LEFT, spacing: { before: 20, after: 20 },
            children: [new TextRun({ text: text || "", bold: opts.bold || false, font: "Arial", size: opts.fontSize || 18, color: opts.color })]
          })]
        });
      }
      function hCell(text, width, opts = {}) {
        return cell(text, width, { bold: true, bg: "1A5276", color: "FFFFFF", align: AlignmentType.CENTER, ...opts });
      }

      const kpiData = formData.kpis || {};
      const rows = [];

      // Title
      rows.push(new TableRow({ children: [hCell("COFFMAN QAPI  |  " + dept.name.toUpperCase() + "  |  MONTHLY INPUT FORM", TABLE_W, { span: 5, fontSize: 22 })] }));
      // Position / Month
      rows.push(new TableRow({ children: [
        cell("Position: " + dept.name, COL_A + COL_B, { bold: true, span: 2 }),
        cell("Reporting Month: " + MONTHS[month] + " " + year, COL_C + COL_D + COL_E, { bold: true, span: 3 }),
      ]}));
      // Sources
      rows.push(new TableRow({ children: [cell("Data Sources: " + (dept.dataSources || ""), TABLE_W, { span: 5, bg: "F2F2F2", fontSize: 16 })] }));
      // Column headers
      rows.push(new TableRow({ children: [hCell("Performance Metric / KPI", COL_A), hCell("Prior Mo.", COL_B), hCell("Current Mo.", COL_C), hCell("Threshold/Target", COL_D), hCell("Trend / Notes", COL_E)] }));
      // KPIs
      dept.kpis.forEach((kpi, i) => {
        const k = kpiData[i] || {};
        const bg = i % 2 === 1 ? "F8F9FA" : undefined;
        rows.push(new TableRow({ children: [
          cell(kpi.metric, COL_A, { bg, fontSize: 17 }),
          cell(k.prior || "", COL_B, { align: AlignmentType.CENTER, bg }),
          cell(k.current || "", COL_C, { align: AlignmentType.CENTER, bg }),
          cell(kpi.threshold || "\u2014", COL_D, { align: AlignmentType.CENTER, bg }),
          cell(k.notes || "", COL_E, { bg, fontSize: 16 }),
        ]}));
      });
      // Opportunities
      rows.push(new TableRow({ children: [hCell("OPPORTUNITIES FOR IMPROVEMENT / BARRIERS (identify at least 1)", TABLE_W, { span: 5, align: AlignmentType.LEFT })] }));
      (formData.opportunities || ["","",""]).forEach((opp, i) => {
        rows.push(new TableRow({ children: [cell((i+1) + ". " + (opp || ""), TABLE_W, { span: 5 })] }));
      });
      // Plan
      rows.push(new TableRow({ children: [hCell("PLAN FOR IMPROVEMENT", TABLE_W, { span: 5, align: AlignmentType.LEFT })] }));
      const PCA = 4500, PCB = 2200, PCC = 1580, PCD = 1800;
      rows.push(new TableRow({ children: [hCell("Action / Intervention", PCA), hCell("Responsible", PCB), hCell("Due Date", PCC), hCell("Status", PCD)] }));
      (formData.plans || [{},{},{},{}]).forEach(p => {
        rows.push(new TableRow({ children: [cell(p.action||"",PCA), cell(p.responsible||"",PCB,{align:AlignmentType.CENTER}), cell(p.dueDate||"",PCC,{align:AlignmentType.CENTER}), cell(p.status||"",PCD,{align:AlignmentType.CENTER})] }));
      });
      // Signature
      const noBorder = { style: BorderStyle.NONE, size: 0 };
      rows.push(new TableRow({ children: [new TableCell({
        width: { size: TABLE_W, type: WidthType.DXA }, columnSpan: 5,
        borders: { top: noBorder, bottom: noBorder, left: noBorder, right: noBorder },
        margins: { top: 120, bottom: 40, left: 80, right: 80 },
        children: [new Paragraph({ spacing: { before: 120 }, children: [
          new TextRun({ text: "Prepared by: " + (formData.preparedBy||"") + "     Date: " + (formData.preparedDate||"") + "     Presented at QAPI: " + (formData.presentedAtQapi ? "Yes" : "No"), font: "Arial", size: 18 })
        ]})]
      })] }));

      const table = new Table({ width: { size: TABLE_W, type: WidthType.DXA }, columnWidths: [COL_A, COL_B, COL_C, COL_D, COL_E], rows });
      const doc = new Document({ sections: [{ properties: { page: { size: { width: PAGE_W, height: 15840 }, margin: { top: 720, right: MARGIN, bottom: 720, left: MARGIN } } }, children: [table] }] });
      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "QAPI_" + dept.name.replace(/[\s\/]/g, "_") + "_" + MONTHS[month] + "_" + year + ".docx";
      a.click();
      URL.revokeObjectURL(url);
    }

    /* ==============================================================
       COPY TO CLIPBOARD
       ============================================================== */
    function copyToClipboard(dept, formData, month, year) {
      const kpiData = formData.kpis || {};
      let text = "COFFMAN QAPI  |  " + dept.name.toUpperCase() + "  |  MONTHLY INPUT FORM\n";
      text += "Position: " + dept.name + "\nReporting Month: " + MONTHS[month] + " " + year + "\n";
      text += "Data Sources: " + (dept.dataSources || "") + "\n\n" + "=".repeat(70) + "\nPERFORMANCE METRICS\n" + "=".repeat(70) + "\n\n";
      dept.kpis.forEach((kpi, i) => {
        const k = kpiData[i] || {};
        text += kpi.metric + "\n  Prior: " + (k.prior || "\u2014") + "  |  Current: " + (k.current || "\u2014") + "  |  Threshold: " + (kpi.threshold || "\u2014");
        if (k.notes) text += "\n  Notes: " + k.notes;
        text += "\n\n";
      });
      text += "=".repeat(70) + "\nOPPORTUNITIES FOR IMPROVEMENT / BARRIERS\n" + "=".repeat(70) + "\n\n";
      (formData.opportunities || []).forEach((o, i) => { if (o) text += (i+1) + ". " + o + "\n"; });
      text += "\n" + "=".repeat(70) + "\nPLAN FOR IMPROVEMENT\n" + "=".repeat(70) + "\n\n";
      (formData.plans || []).forEach((p, i) => { if (p.action) text += (i+1) + ". " + p.action + "\n   Responsible: " + (p.responsible||"\u2014") + "  |  Due: " + (p.dueDate||"\u2014") + "  |  Status: " + (p.status||"\u2014") + "\n\n"; });
      text += "\nPrepared by: " + (formData.preparedBy||"") + "  |  Date: " + (formData.preparedDate||"") + "  |  Presented at QAPI: " + (formData.presentedAtQapi ? "Yes" : "No") + "\n";
      navigator.clipboard.writeText(text);
      return true;
    }

    /* ==============================================================
       MAIN APP
       ============================================================== */
    function App() {
      const [screen, setScreen] = useState("home");
      const [config, setConfig] = useState(getConfig);
      const [departments, setDepartments] = useState(FALLBACK_DEPARTMENTS);
      const [selectedDept, setSelectedDept] = useState(null);
      const [allData, setAllData] = useState(getLocalData);
      const [loading, setLoading] = useState(false);
      const [saving, setSaving] = useState(false);
      const [toast, setToast] = useState(null);
      const [connected, setConnected] = useState(false);

      const now = new Date();
      const [month, setMonth] = useState(now.getMonth());
      const [year, setYear] = useState(now.getFullYear());

      const scriptUrl = config.scriptUrl || "";

      // Load config from Google Sheet on mount
      useEffect(() => {
        if (scriptUrl) loadSheetConfig();
      }, [scriptUrl]);

      async function loadSheetConfig() {
        try {
          setLoading(true);
          const result = await fetchFromSheet(scriptUrl, "config");
          if (result.success && result.departments) {
            setDepartments(result.departments);
            setConnected(true);
            if (result.sheetId) {
              const c = { ...config, sheetId: result.sheetId };
              setConfig(c);
              saveConfig(c);
            }
          }
        } catch (e) {
          console.log("Sheet not connected, using fallback data");
          setConnected(false);
        } finally {
          setLoading(false);
        }
      }

      // Load existing data from sheet for selected department
      async function loadDeptDataFromSheet(deptName) {
        if (!scriptUrl || !connected) return;
        try {
          const result = await fetchFromSheet(scriptUrl, "data", { dept: deptName });
          if (result.success && result.data) {
            const d = result.data;
            const key = getFormKey(deptName, month, year);
            const kpis = {};
            (d.kpis || []).forEach((k, i) => {
              kpis[i] = { prior: k.prior, current: k.current, notes: k.notes };
            });
            const formData = {
              kpis,
              opportunities: d.opportunities?.length ? d.opportunities : ["","",""],
              plans: d.plans?.length ? d.plans : [{},{},{},{}],
              preparedBy: "",
              preparedDate: "",
              presentedAtQapi: false,
            };
            setAllData(prev => {
              const next = { ...prev, [key]: formData };
              saveLocalData(next);
              return next;
            });
          }
        } catch (e) { /* use local data */ }
      }

      // Save to Google Sheet
      async function saveToSheet(deptName, formData, dept) {
        if (!scriptUrl || !connected) return;
        try {
          setSaving(true);
          const kpiPayload = dept.kpis.map((kpi, i) => {
            const k = formData.kpis?.[i] || {};
            return { prior: k.prior || "", current: k.current || "", notes: k.notes || "" };
          });
          await postToSheet(scriptUrl, {
            dept: deptName,
            data: {
              reportingMonth: MONTHS[month] + " " + year,
              kpis: kpiPayload,
              opportunities: formData.opportunities || [],
              plans: formData.plans || [],
            }
          });
          setToast({ message: "Saved to Google Sheet", type: "success" });
        } catch (e) {
          setToast({ message: "Could not save to sheet. Data saved locally.", type: "error" });
        } finally {
          setSaving(false);
        }
      }

      const formKey = selectedDept ? getFormKey(selectedDept, month, year) : null;
      const dept = selectedDept ? departments[selectedDept] : null;

      const formData = useMemo(() => {
        if (!formKey) return null;
        return allData[formKey] || {
          kpis: {},
          opportunities: ["", "", ""],
          plans: [{},{},{},{}],
          preparedBy: "",
          preparedDate: "",
          presentedAtQapi: false,
        };
      }, [formKey, allData]);

      const updateForm = useCallback((updater) => {
        setAllData(prev => {
          const current = prev[formKey] || {
            kpis: {}, opportunities: ["","",""], plans: [{},{},{},{}],
            preparedBy: "", preparedDate: "", presentedAtQapi: false,
          };
          const updated = typeof updater === "function" ? updater(current) : { ...current, ...updater };
          const next = { ...prev, [formKey]: updated };
          saveLocalData(next);
          return next;
        });
      }, [formKey]);

      function openDept(deptName) {
        setSelectedDept(deptName);
        setScreen("form");
        loadDeptDataFromSheet(deptName);
      }

      const deptList = useMemo(() => Object.keys(departments).sort(), [departments]);

      /* ---- SETUP SCREEN ---- */
      if (screen === "setup") {
        return (
          <div className="max-w-2xl mx-auto p-4">
            <div className="bg-qapi-blue text-white rounded-xl p-6 mb-6">
              <h1 className="text-xl font-bold text-center">Google Sheet Connection Setup</h1>
            </div>
            <div className="bg-white rounded-lg shadow p-6 space-y-4">
              <div>
                <label className="block font-semibold text-sm mb-1">Google Apps Script Web App URL</label>
                <input
                  className="field-input"
                  placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                  value={config.scriptUrl || ""}
                  onChange={e => {
                    const c = { ...config, scriptUrl: e.target.value };
                    setConfig(c);
                    saveConfig(c);
                  }}
                />
                <p className="text-xs text-gray-500 mt-1">Paste the URL from your Google Apps Script deployment</p>
              </div>
              <div className="bg-blue-50 rounded-lg p-4 text-sm space-y-2">
                <p className="font-bold text-qapi-blue">Setup Instructions:</p>
                <ol className="list-decimal pl-5 space-y-1 text-gray-700">
                  <li>Create a new <strong>blank Google Sheet</strong></li>
                  <li>Copy the <strong>Sheet ID</strong> from the URL (the long string between <code>/d/</code> and <code>/edit</code>)</li>
                  <li>Go to <a href="https://script.google.com" target="_blank" className="text-blue-600 underline">script.google.com</a> &gt; <strong>New project</strong></li>
                  <li>Delete any existing code and paste the contents of <strong>qapi-full-script.js</strong></li>
                  <li>Update <strong>line 22</strong>: replace the SHEET_ID with your new Sheet ID</li>
                  <li>In the function dropdown, select <strong>setupSheet</strong> and click <strong>Run</strong></li>
                  <li>Authorize when prompted (click Advanced &gt; Go to project &gt; Allow)</li>
                  <li>Click <strong>Deploy &gt; New deployment</strong></li>
                  <li>Type: <strong>Web app</strong> | Execute as: <strong>Me</strong> | Access: <strong>Anyone</strong></li>
                  <li>Click Deploy, copy the Web App URL, and paste it above</li>
                </ol>
              </div>
              {config.scriptUrl && (
                <button
                  onClick={async () => {
                    setLoading(true);
                    try {
                      const result = await fetchFromSheet(config.scriptUrl, "config");
                      if (result.success) {
                        setDepartments(result.departments);
                        setConnected(true);
                        setToast({ message: "Connected! " + Object.keys(result.departments).length + " departments loaded.", type: "success" });
                      } else {
                        setToast({ message: "Error: " + (result.error || "Unknown"), type: "error" });
                      }
                    } catch (e) {
                      setToast({ message: "Connection failed. Check the URL.", type: "error" });
                    }
                    setLoading(false);
                  }}
                  className="bg-qapi-blue text-white px-6 py-3 rounded-lg font-semibold w-full hover:opacity-90"
                  disabled={loading}
                >
                  {loading ? <span className="spinner mr-2" /> : null}
                  Test Connection
                </button>
              )}
              <button onClick={() => setScreen("home")} className="bg-gray-200 px-4 py-2 rounded-lg text-sm w-full">
                &larr; Back to Home
              </button>
            </div>
            {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
          </div>
        );
      }

      /* ---- HOME SCREEN ---- */
      if (screen === "home") {
        return (
          <div className="max-w-4xl mx-auto p-4">
            <div className="bg-qapi-blue text-white rounded-xl p-6 mb-6 shadow-lg">
              <h1 className="text-2xl font-bold text-center">COFFMAN QAPI</h1>
              <p className="text-center text-qapi-accent mt-1 text-sm">Monthly Department Input Forms</p>
              <p className="text-center text-blue-200 text-xs mt-1">{FACILITY}</p>
              <div className="text-center mt-2">
                {connected
                  ? <a href={config.sheetId ? `https://docs.google.com/spreadsheets/d/${config.sheetId}/edit` : '#'}
                       target="_blank" rel="noopener noreferrer"
                       className="inline-flex items-center gap-1 bg-green-600 text-white text-xs px-3 py-1 rounded-full hover:bg-green-700 transition-colors no-underline cursor-pointer">
                      <span className="w-2 h-2 bg-green-300 rounded-full inline-block" /> Connected to Google Sheet &#x2197;
                    </a>
                  : <span className="inline-flex items-center gap-1 bg-yellow-600 text-white text-xs px-3 py-1 rounded-full">
                      Offline Mode (local storage only)
                    </span>
                }
              </div>
            </div>

            <div className="bg-white rounded-lg shadow p-4 mb-6 flex flex-wrap items-center gap-3 justify-center">
              <label className="font-semibold text-sm text-gray-600">Reporting Month:</label>
              <select className="field-input w-auto" value={month} onChange={e => setMonth(parseInt(e.target.value))}>
                {MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
              </select>
              <select className="field-input w-auto" value={year} onChange={e => setYear(parseInt(e.target.value))}>
                {[2025,2026,2027,2028].map(y => <option key={y} value={y}>{y}</option>)}
              </select>
              <div className="ml-auto flex items-center gap-3 no-print">
                {connected && config.sheetId && (
                  <a href={`https://docs.google.com/spreadsheets/d/${config.sheetId}/edit`}
                     target="_blank" rel="noopener noreferrer"
                     className="text-xs text-qapi-green hover:underline">
                    Open Google Sheet &#x2197;
                  </a>
                )}
                <button onClick={() => setScreen("setup")} className="text-xs text-qapi-light hover:underline">
                  {connected ? "Sheet Settings" : "Connect Google Sheet"}
                </button>
              </div>
            </div>

            {loading ? (
              <div className="text-center py-12"><span className="spinner" /><p className="text-sm text-gray-500 mt-3">Loading from Google Sheet...</p></div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {deptList.map(deptName => {
                  const d = departments[deptName];
                  const key = getFormKey(deptName, month, year);
                  const data = allData[key];
                  const filled = data ? Object.keys(data.kpis || {}).filter(k => data.kpis[k]?.current).length : 0;
                  const total = d.kpis.length;
                  const pct = total > 0 ? Math.round((filled / total) * 100) : 0;
                  return (
                    <button key={deptName} onClick={() => openDept(deptName)}
                      className="bg-white rounded-lg shadow hover:shadow-lg transition-all p-4 text-left border-l-4 border-qapi-blue hover:border-qapi-light">
                      <div className="font-bold text-qapi-blue text-sm">{deptName}</div>
                      <div className="mt-3 flex items-center gap-2">
                        <div className="flex-1 bg-gray-200 rounded-full h-2">
                          <div className="bg-qapi-blue rounded-full h-2 transition-all" style={{ width: `${pct}%` }} />
                        </div>
                        <span className="text-xs text-gray-500 font-medium">{filled}/{total}</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
            <p className="text-center text-xs text-gray-400 mt-6">
              {connected ? "Data syncs with Google Sheet. Also saved locally as backup." : "Data saved locally. Connect a Google Sheet for shared access."}
            </p>
            {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
          </div>
        );
      }

      /* ---- FORM SCREEN ---- */
      if (screen === "form" && dept && formData) {
        const kpiData = formData.kpis || {};
        return (
          <div className="max-w-5xl mx-auto p-4">
            <div className="flex flex-wrap items-center gap-2 mb-4 no-print">
              <button onClick={() => setScreen("home")} className="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm font-medium">&larr; All Departments</button>
              <div className="flex-1" />
              {connected && (
                <button onClick={() => saveToSheet(selectedDept, formData, dept)} disabled={saving}
                  className="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 flex items-center gap-2">
                  {saving && <span className="spinner" style={{width:16,height:16,borderWidth:2}} />}
                  Save to Sheet
                </button>
              )}
              <button onClick={() => { copyToClipboard(dept, formData, month, year); setToast({ message: "Copied to clipboard!", type: "success" }); }}
                className="bg-qapi-green text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90">Copy to Clipboard</button>
              <button onClick={() => exportToWord(dept, formData, month, year)}
                className="bg-qapi-blue text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90">Export to Word</button>
            </div>

            <div className="bg-qapi-blue text-white rounded-t-lg p-4 text-center">
              <h2 className="text-lg font-bold">COFFMAN QAPI  |  {dept.name.toUpperCase()}  |  MONTHLY INPUT FORM</h2>
            </div>
            <div className="bg-white border border-gray-200 p-4 flex flex-wrap gap-4 items-center">
              <div className="flex-1 min-w-[200px]">
                <label className="text-xs text-gray-500 font-medium">Position</label>
                <div className="mt-1 text-sm font-medium text-gray-700 py-2">{dept.name}</div>
              </div>
              <div>
                <label className="text-xs text-gray-500 font-medium">Reporting Month</label>
                <div className="mt-1 text-sm font-medium text-gray-700 py-2">{MONTHS[month]} {year}</div>
              </div>
            </div>
            {dept.dataSources && (
              <div className="bg-gray-50 border border-gray-200 border-t-0 p-3 text-xs text-gray-500 italic">Data Sources: {dept.dataSources}</div>
            )}

            {/* KPI TABLE */}
            <div className="overflow-x-auto mt-4">
              <table className="w-full border-collapse bg-white shadow rounded-lg overflow-hidden">
                <thead>
                  <tr className="bg-qapi-blue text-white text-sm">
                    <th className="p-3 text-left font-semibold" style={{width:"35%"}}>Performance Metric / KPI</th>
                    <th className="p-3 text-center font-semibold" style={{width:"13%"}}>Prior Mo.</th>
                    <th className="p-3 text-center font-semibold" style={{width:"13%"}}>Current Mo.</th>
                    <th className="p-3 text-center font-semibold" style={{width:"14%"}}>Threshold</th>
                    <th className="p-3 text-center font-semibold" style={{width:"8%"}}>Status</th>
                    <th className="p-3 text-left font-semibold" style={{width:"17%"}}>Trend / Notes</th>
                  </tr>
                </thead>
                <tbody>
                  {dept.kpis.map((kpi, i) => {
                    const k = kpiData[i] || {};
                    const trend = getTrend(k.prior, k.current);
                    const status = checkThreshold(k.current, kpi.threshold);
                    return (
                      <tr key={i} className={i % 2 === 1 ? "bg-gray-50" : "bg-white"}>
                        <td className="p-2 pl-3 text-sm border-b border-gray-100 font-medium">{kpi.metric}</td>
                        <td className="p-1 border-b border-gray-100">
                          <input className="field-input kpi-input text-sm" placeholder={"\u2014"} value={k.prior ?? ""}
                            onChange={e => updateForm(prev => { const kpis = { ...prev.kpis }; kpis[i] = { ...kpis[i], prior: e.target.value }; return { ...prev, kpis }; })} />
                        </td>
                        <td className="p-1 border-b border-gray-100">
                          <input className="field-input kpi-input text-sm" placeholder={"\u2014"} value={k.current ?? ""}
                            onChange={e => updateForm(prev => { const kpis = { ...prev.kpis }; kpis[i] = { ...kpis[i], current: e.target.value }; return { ...prev, kpis }; })} />
                        </td>
                        <td className="p-2 text-center text-xs border-b border-gray-100 text-gray-600">{kpi.threshold || "\u2014"}</td>
                        <td className="p-2 text-center border-b border-gray-100">
                          {status === "met" && <span className="status-badge status-met">Met</span>}
                          {status === "not-met" && <span className="status-badge status-not-met">Not Met</span>}
                          {status === "track" && <span className="status-badge status-track">Track</span>}
                          {trend && <span className={`ml-1 text-lg font-bold ${trend === "up" ? "trend-up" : trend === "down" ? "trend-down" : "trend-flat"}`}>{getTrendIcon(trend)}</span>}
                        </td>
                        <td className="p-1 border-b border-gray-100">
                          <input className="field-input text-xs" placeholder="Notes..." value={k.notes ?? ""}
                            onChange={e => updateForm(prev => { const kpis = { ...prev.kpis }; kpis[i] = { ...kpis[i], notes: e.target.value }; return { ...prev, kpis }; })} />
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* OPPORTUNITIES */}
            <div className="mt-6">
              <div className="bg-qapi-blue text-white p-3 rounded-t-lg font-semibold text-sm">OPPORTUNITIES FOR IMPROVEMENT / BARRIERS (identify at least 1)</div>
              <div className="bg-white border border-gray-200 border-t-0 p-4 space-y-3">
                {(formData.opportunities || ["","",""]).map((opp, i) => (
                  <div key={i} className="flex gap-2 items-start">
                    <span className="text-sm font-bold text-gray-400 mt-2">{i+1}.</span>
                    <textarea className="field-input text-sm" rows={2}
                      placeholder={i === 0 ? "Required: identify at least one opportunity or barrier" : "Optional..."}
                      value={opp}
                      onChange={e => updateForm(prev => { const opps = [...(prev.opportunities || ["","",""])]; opps[i] = e.target.value; return { ...prev, opportunities: opps }; })} />
                  </div>
                ))}
              </div>
            </div>

            {/* PLAN FOR IMPROVEMENT */}
            <div className="mt-6">
              <div className="bg-qapi-blue text-white p-3 rounded-t-lg font-semibold text-sm">PLAN FOR IMPROVEMENT</div>
              <div className="overflow-x-auto">
                <table className="w-full bg-white border border-gray-200 border-t-0">
                  <thead><tr className="bg-gray-100 text-xs text-gray-600">
                    <th className="p-2 text-left font-semibold" style={{width:"40%"}}>Action / Intervention</th>
                    <th className="p-2 text-left font-semibold" style={{width:"22%"}}>Responsible</th>
                    <th className="p-2 text-left font-semibold" style={{width:"16%"}}>Due Date</th>
                    <th className="p-2 text-left font-semibold" style={{width:"22%"}}>Status</th>
                  </tr></thead>
                  <tbody>
                    {(formData.plans || [{},{},{},{}]).map((plan, i) => (
                      <tr key={i} className="border-b border-gray-100">
                        <td className="p-1"><input className="field-input text-sm" placeholder="Action item..." value={plan.action || ""}
                          onChange={e => updateForm(prev => { const plans = [...(prev.plans || [{},{},{},{}])]; plans[i] = { ...plans[i], action: e.target.value }; return { ...prev, plans }; })} /></td>
                        <td className="p-1"><input className="field-input text-sm" placeholder="Who?" value={plan.responsible || ""}
                          onChange={e => updateForm(prev => { const plans = [...(prev.plans || [{},{},{},{}])]; plans[i] = { ...plans[i], responsible: e.target.value }; return { ...prev, plans }; })} /></td>
                        <td className="p-1"><input type="date" className="field-input text-sm" value={plan.dueDate || ""}
                          onChange={e => updateForm(prev => { const plans = [...(prev.plans || [{},{},{},{}])]; plans[i] = { ...plans[i], dueDate: e.target.value }; return { ...prev, plans }; })} /></td>
                        <td className="p-1"><select className="field-input text-sm" value={plan.status || ""}
                          onChange={e => updateForm(prev => { const plans = [...(prev.plans || [{},{},{},{}])]; plans[i] = { ...plans[i], status: e.target.value }; return { ...prev, plans }; })}>
                          <option value="">Select...</option>
                          {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                        </select></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* SIGNATURE */}
            <div className="mt-6 bg-white rounded-lg border border-gray-200 p-4">
              <div className="flex flex-wrap gap-4">
                <div className="flex-1 min-w-[200px]">
                  <label className="text-xs text-gray-500 font-medium">Prepared by</label>
                  <input className="field-input mt-1" placeholder="Your name" value={formData.preparedBy || ""}
                    onChange={e => updateForm({ preparedBy: e.target.value })} />
                </div>
                <div className="min-w-[160px]">
                  <label className="text-xs text-gray-500 font-medium">Date</label>
                  <input type="date" className="field-input mt-1" value={formData.preparedDate || ""}
                    onChange={e => updateForm({ preparedDate: e.target.value })} />
                </div>
                <div className="flex items-end pb-1 gap-2">
                  <label className="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" className="w-5 h-5 rounded" checked={formData.presentedAtQapi || false}
                      onChange={e => updateForm({ presentedAtQapi: e.target.checked })} />
                    <span className="text-sm font-medium">Presented at QAPI</span>
                  </label>
                </div>
              </div>
            </div>

            {/* BOTTOM ACTIONS */}
            <div className="mt-6 flex flex-wrap gap-3 justify-center no-print mb-8">
              {connected && (
                <button onClick={() => saveToSheet(selectedDept, formData, dept)} disabled={saving}
                  className="bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 shadow flex items-center gap-2">
                  {saving && <span className="spinner" style={{width:18,height:18,borderWidth:2}} />}
                  Save to Google Sheet
                </button>
              )}
              <button onClick={() => { copyToClipboard(dept, formData, month, year); setToast({ message: "Copied!", type: "success" }); }}
                className="bg-qapi-green text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 shadow">Copy to Clipboard</button>
              <button onClick={() => exportToWord(dept, formData, month, year)}
                className="bg-qapi-blue text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 shadow">Export to Word</button>
              <button onClick={() => window.print()} className="bg-gray-600 text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 shadow">Print</button>
            </div>
            {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
          </div>
        );
      }
      return null;
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
